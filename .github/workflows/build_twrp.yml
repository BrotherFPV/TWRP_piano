# .github/workflows/build_twrp.yml
name: Build TWRP (AOSP) - Xiaomi Pad 8 Pro (piano)

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'TWRP Manifest 仓库地址'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git'
      MANIFEST_BRANCH:
        description: 'TWRP Manifest 分支'
        required: true
        default: 'twrp-14.0'
      DEVICE_TREE_URL:
        description: '设备树 仓库地址'
        required: true
        default: 'https://github.com/BrotherFPV/android_device_xiaomi_piano'
      DEVICE_TREE_BRANCH:
        description: '设备树 分支'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: '设备树 源码存放路径'
        required: true
        default: 'device/xiaomi/piano'
      DEVICE_NAME:
        description: '设备代号 (Codename)'
        required: true
        default: 'piano'
      MAKEFILE_NAME:
        description: '编译 Makefile 前缀'
        required: true
        default: 'omni_piano'
      BUILD_TARGET:
        description: '编译目标文件 (vendor_bootimage / bootimage / recoveryimage)'
        required: true
        default: 'vendor_bootimage'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: 释放 Runner 磁盘空间
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: 安装编译依赖环境
      run: |
        sudo apt-get update
        sudo apt-get install -y gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
          libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
          libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig repo git openjdk-11-jdk \
          python3 python-is-python3 libssl-dev bc ccache flex bison build-essential liblz4-tool

    - name: 配置 Git 与 Repo 工具
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: 初始化与同步源码 (Minimal TWRP)
      run: |
        mkdir -p workspace
        cd workspace
        repo init -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }} --depth=1
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: 克隆设备树 (Device Tree)
      run: |
        cd workspace
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} temp_tree
        mkdir -p device/xiaomi
        mv temp_tree/xiaomi/piano device/xiaomi/piano
        rm -rf temp_tree
  
    - name: 开始编译 TWRP
      run: |
        cd workspace
        source build/envsetup.sh
        lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng || lunch ${{ github.event.inputs.MAKEFILE_NAME }}-userdebug
        mka ${{ github.event.inputs.BUILD_TARGET }} -j$(nproc --all)

    - name: 上传编译产物
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_number }}
        path: |
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/vendor_boot.img
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/boot.img
          workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery.img
